name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # NOTE: the job names are the checks the main ruleset requires. Renaming one,
  # or folding one into another, blocks every pull request until the ruleset
  # is changed to match.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub workflows
        uses: docker://index.docker.io/rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      # NOTE: pinned to v0.11.0, not the runner's. The scripts are POSIX sh, and
      # the apt shellcheck is old enough to disagree with a current one about
      # SC2015, so an unpinned lint fails on the runner and passes on a desk.
      - name: Lint the scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -s sh .github/scripts/*

      # Annotations rather than the Security tab: zizmor exits 0 whenever it
      # writes SARIF, so that mode reports findings and never fails the job.
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          online-audits: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: go.mod

      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          printf '%s\n' "$unformatted"
          test -z "$unformatted"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  sheet:
    name: Sheet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: go.mod

      # The sheet and the export both claim they cannot drift from the palette,
      # which is only true if something checks.
      - name: Redraw the sheet and the export
        run: .github/scripts/screenshot -s

      - name: Check they match what is committed
        run: git diff --exit-code -- assets/palette.svg basalt.json
